<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Thermal 80mm Receipt</title>
  <style>
    @page { size: 80mm auto; margin: 4mm; }
    body { font-family: Arial, sans-serif; width: 72mm; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; }
    td { border-bottom: 1px dashed #aaa; font-size: 12px; padding: 4px 0; }
  </style>
</head>
<body>
  <h3>{{restaurantName}}</h3>
  <p>Order #{{orderNo}} - {{dateTime}}</p>
  <table>{{itemsRows}}</table>
  <p>Subtotal: {{subtotal}}</p>
  <p>Discount: {{discount}}</p>
  <p>Tax: {{tax}}</p>
  <p>Service: {{service}}</p>
  <h4>Total: {{grandTotal}}</h4>
  <p>{{footer}}</p>
</body>
</html>
